name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El proyecto vive en TransitGDL_CLEAN/; GitHub solo lee los flujos de la
# raíz del repositorio, así que cada paso se ejecuta dentro de esa carpeta.
defaults:
  run:
    working-directory: TransitGDL_CLEAN

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            TransitGDL_CLEAN/requirements.txt
            TransitGDL_CLEAN/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Run static analysis
        run: |
          black --check api core tests scripts bot
          ruff check api core tests scripts bot
      - name: Verify syntax
        run: python -m compileall -q api core bot scripts tests
      - name: Build transit database from the official feed
        # Sin red: usa el zip incluido en el repositorio.
        run: python scripts/build_transit_db.py
