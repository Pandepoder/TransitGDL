name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Run static analysis
        run: |
          black --check api core tests scripts
          ruff check api core tests scripts bot
      - name: Verify syntax
        run: python -m compileall api core bot scripts tests
      - name: Build transit database from the official feed
        # Sin red: usa el zip incluido en el repositorio.
        run: python scripts/build_transit_db.py
