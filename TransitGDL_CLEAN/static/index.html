<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E141B">
<title>TransitGDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/static/css/app.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<div class="app">
  <main class="map-wrap" id="map-wrap">
    <div id="map" class="map" role="region" aria-label="Mapa de rutas y unidades en servicio"></div>
    <canvas id="vehicle-layer" class="vehicle-layer" aria-hidden="true"></canvas>

    <div class="status" id="status" aria-live="polite">
      <span class="chip" id="chip-weather"><span class="chip-dot chip-dot--muted"></span><span>Cargando clima…</span></span>
      <span class="chip" id="chip-live"><span class="chip-dot"></span><span>Conectando…</span></span>
      <span class="chip chip--muted" id="chip-feed">Datos oficiales del AMG</span>
    </div>

    <div class="legend" id="legend" hidden>
      <span class="legend-row"><svg width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="26" y2="4" stroke="currentColor" stroke-width="4" stroke-linecap="round"></line></svg><span id="legend-active">Sentido elegido</span></span>
      <span class="legend-row"><svg width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="26" y2="4" stroke="currentColor" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"></line></svg><span>Sentido contrario</span></span>
      <span class="legend-row"><svg width="28" height="14" aria-hidden="true"><circle cx="14" cy="7" r="6" fill="currentColor"></circle></svg><span>Unidad en vivo, apunta a su rumbo</span></span>
    </div>

    <div class="map-controls">
      <button type="button" class="icon-btn" id="zoom-in" aria-label="Acercar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button type="button" class="icon-btn" id="zoom-out" aria-label="Alejar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <button type="button" class="icon-btn" id="locate" aria-label="Paradas cerca de mi ubicación"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </main>

  <aside class="panel" id="panel" aria-label="Panel de información">
    <button type="button" class="sheet-handle" id="sheet-handle" aria-label="Cambiar la altura del panel"><span></span></button>

    <div class="panel-head">
      <div class="brand">
        <span class="brand-name">Transit<span>GDL</span></span>
        <span class="brand-sub">Área Metropolitana de Guadalajara</span>
      </div>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="search-label" for="search-input">Ruta, parada o lugar</label>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="search-input" type="search" placeholder="231, T15, CUCEI, Minerva…" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" spellcheck="false">
          <button type="button" class="search-clear" id="search-clear" aria-label="Borrar búsqueda" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <ul class="search-results" id="search-results" role="listbox" aria-label="Resultados" hidden></ul>
      </form>
    </div>

    <div class="tabs" role="tablist" aria-label="Secciones">
      <button type="button" role="tab" id="tab-arrivals" aria-controls="pane-arrivals" aria-selected="true">Llegadas</button>
      <button type="button" role="tab" id="tab-routes" aria-controls="pane-routes" aria-selected="false" tabindex="-1">Rutas</button>
      <button type="button" role="tab" id="tab-expert" aria-controls="pane-expert" aria-selected="false" tabindex="-1">Experto</button>
      <button type="button" role="tab" id="tab-ops" aria-controls="pane-ops" aria-selected="false" tabindex="-1">Operación</button>
      <button type="button" role="tab" id="tab-chat" aria-controls="pane-chat" aria-selected="false" tabindex="-1">Asistente</button>
    </div>

    <div class="panes">
      <section class="pane" id="pane-arrivals" role="tabpanel" aria-labelledby="tab-arrivals"></section>
      <section class="pane" id="pane-routes" role="tabpanel" aria-labelledby="tab-routes" hidden></section>
      <section class="pane" id="pane-expert" role="tabpanel" aria-labelledby="tab-expert" hidden></section>
      <section class="pane" id="pane-ops" role="tabpanel" aria-labelledby="tab-ops" hidden></section>
      <section class="pane pane--chat" id="pane-chat" role="tabpanel" aria-labelledby="tab-chat" hidden></section>
    </div>
  </aside>
</div>
</body>
</html>
